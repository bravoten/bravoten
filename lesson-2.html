<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#6654d9">
<title>درس — برافوتِن</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E🌟%3C/text%3E%3C/svg%3E">
<style>
:root{--ink:#192744;--muted:#65738a;--purple:#6654d9;--pale:#eeeaff;--teal:#20a78e;--yellow:#ffca55;--pink:#ff7d9d;--blue:#4aa8ff;--bg:#fbf9ff;--line:#eceaf4;--good:#15a06a;--bad:#e8590c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);background:radial-gradient(ellipse at 0 0,#eeeaff 0,transparent 30%),radial-gradient(ellipse at 100% 25%,#e4fbf4 0,transparent 28%),radial-gradient(ellipse at 50% 100%,#fff3d6 0,transparent 35%),var(--bg);font-family:Tahoma,Arial,sans-serif;line-height:1.7;min-height:100vh;overflow-x:hidden}
button{font:inherit;cursor:pointer;color:inherit}
a{color:inherit;text-decoration:none}
.wrap{width:min(760px,94%);margin:auto}
header{position:sticky;top:0;z-index:30;background:#ffffffee;backdrop-filter:blur(10px);border-bottom:1px solid var(--line);box-shadow:0 5px 22px #1927440b}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0}
.back{background:var(--pale);color:#5140bb;padding:8px 13px;border-radius:12px;font-weight:bold;white-space:nowrap}
.hud{display:flex;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff6dc;border:1px solid #f6e3ab;border-radius:99px;padding:5px 12px;font-weight:900;color:#7a5600}
.mute{border:1px solid var(--line);background:#fff;border-radius:99px;width:40px;height:40px;font-size:1.15rem}
main{padding:16px 0 60px}
.crumb{color:var(--muted);font-size:.9rem;margin:2px 4px 0}
h1{font-size:clamp(1.45rem,5vw,2rem);line-height:1.35;margin:4px 4px 6px}
.goal{margin:0 4px 12px;color:var(--muted)}
.dots{display:flex;gap:6px;justify-content:center;margin:6px 0 12px}
.dot{width:34px;height:9px;border-radius:9px;background:#e5e1f5;transition:.3s}
.dot.on{background:var(--teal);width:48px}
.dot.done{background:var(--purple)}
.card{background:#fff;border:1px solid var(--line);border-radius:28px;padding:18px;box-shadow:0 14px 36px #283a680f;position:relative;overflow:hidden}
.enter{animation:slideIn .45s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes slideIn{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}
.mascot-row{display:flex;gap:12px;align-items:flex-start}
.mascot{font-size:3.4rem;line-height:1;animation:bob 3s ease-in-out infinite;flex:0 0 auto;filter:drop-shadow(0 5px 0 #0001)}
@keyframes bob{50%{transform:translateY(-7px) rotate(3deg)}}
.bubble{position:relative;background:linear-gradient(135deg,#fff8e4,#fffdf6);border:2px solid #f7e2a6;border-radius:20px;padding:12px 14px;flex:1;font-size:1.05rem}
.bubble h2{margin:0 0 4px;font-size:1.2rem;color:var(--purple)}
.bubble p{margin:0}
.say{margin-top:8px;border:0;background:var(--purple);color:#fff;padding:8px 14px;border-radius:13px;font-weight:bold;box-shadow:0 4px 0 #4b3bb0}
.say:active{transform:translateY(2px);box-shadow:0 2px 0 #4b3bb0}
.bigbox{margin:16px auto 6px;text-align:center}
.big{display:inline-grid;place-items:center;min-width:170px;padding:6px 26px;font-size:clamp(5rem,26vw,9rem);line-height:1.25;font-weight:900;color:var(--purple);background:linear-gradient(145deg,#f3f0ff,#e5fbf5);border:3px dashed #cfc7fb;border-radius:36px;cursor:pointer;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.04)}}
.sub{font-size:1.25rem;font-weight:900;margin-top:6px}
.hint{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 2px 8px;font-weight:bold;color:#5140bb}
.meter{flex:1;height:10px;background:#ece8fb;border-radius:9px;overflow:hidden;max-width:180px}
.meter span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--yellow));transition:width .3s}
.items{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:12px}
.item{position:relative;border:3px solid #ece8fb;border-radius:24px;background:linear-gradient(160deg,#fff,#f8f6ff);padding:12px 6px 10px;text-align:center;box-shadow:0 6px 0 #e6e1f8;transition:transform .15s,box-shadow .15s}
.item:nth-child(4n+2){background:linear-gradient(160deg,#fff,#effcf8)}
.item:nth-child(4n+3){background:linear-gradient(160deg,#fff,#fff7e6)}
.item:nth-child(4n+4){background:linear-gradient(160deg,#fff,#fff0f5)}
.item:hover{transform:translateY(-3px)}
.item:active,.item.hit{animation:boing .5s}
@keyframes boing{30%{transform:scale(1.18) rotate(-4deg)}60%{transform:scale(.95) rotate(3deg)}}
.pic{display:block;font-size:clamp(2.8rem,13vw,4.4rem);line-height:1.15}
.pic.multi{font-size:clamp(1.6rem,8vw,2.4rem)}
.word{display:block;font-weight:900;font-size:1.15rem;margin-top:2px}
.tag{display:block;font-size:.8rem;color:var(--muted)}
.item .seen{position:absolute;top:6px;inset-inline-start:6px;display:none;background:var(--good);color:#fff;width:24px;height:24px;border-radius:50%;font-size:.8rem;line-height:24px}
.item.seen-on{border-color:#a8e6cd;box-shadow:0 6px 0 #bdecd9}
.item.seen-on .seen{display:block}
.forms{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px;direction:rtl}
.form{text-align:center;background:#f6f3ff;border-radius:18px;padding:8px 2px}
.form b{display:block;font-size:2.6rem;line-height:1.3;color:var(--purple);font-family:"Segoe UI",Tahoma,Arial,sans-serif}
.form small{color:var(--muted)}
.list{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:10px}
.list li{display:flex;align-items:center;gap:12px;background:#f8f6ff;border-radius:18px;padding:10px 14px;font-size:1.1rem;font-weight:bold;animation:slideIn .5s both;cursor:pointer}
.list .e{font-size:2rem}
.story{display:grid;gap:10px;margin-top:14px}
.line{background:#fff8e4;border-radius:18px;padding:12px 14px;font-size:1.15rem;display:none;animation:slideIn .4s both;cursor:pointer}
.line.show{display:block}
.reveal{margin-top:12px;border:0;background:var(--pink);color:#fff;padding:10px 16px;border-radius:14px;font-weight:900;box-shadow:0 4px 0 #d85a7b}
.tip{margin-top:16px;background:#f0f9ff;border:1px solid #cfe9fb;border-radius:16px;padding:10px 14px;color:#285a82;font-size:.95rem}
.nav{display:flex;gap:10px;justify-content:space-between;margin-top:16px}
.btn{border:0;border-radius:18px;padding:13px 20px;font-weight:900;font-size:1.1rem;background:var(--purple);color:#fff;box-shadow:0 5px 0 #4b3bb0;transition:transform .12s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #4b3bb0}
.btn.light{background:#fff;color:#5140bb;border:2px solid #d9d2fb;box-shadow:0 5px 0 #e6e1f8}
.btn.go{background:var(--teal);box-shadow:0 5px 0 #168169}
.btn.glow{animation:glow 1.2s infinite}
@keyframes glow{50%{box-shadow:0 0 0 8px #20a78e33,0 5px 0 #168169}}
.btn[disabled]{opacity:.45;pointer-events:none}
/* game */
.track{position:relative;height:56px;margin:2px 6px 14px;background:linear-gradient(90deg,#e5f6ff,#fdf3ff);border-radius:99px;border:2px solid #d9e8f7}
.track .rail{position:absolute;inset:26px 26px auto 26px;height:4px;background:repeating-linear-gradient(90deg,#b8c8e0 0 10px,transparent 10px 18px);border-radius:3px}
.track .rocket{position:absolute;top:6px;font-size:2rem;transition:inset-inline-start .7s cubic-bezier(.3,1.4,.5,1);inset-inline-start:8px}
.track .flag{position:absolute;top:8px;inset-inline-end:10px;font-size:1.8rem}
.qno{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-weight:bold;margin:0 4px 8px}
.qtext{font-size:clamp(1.25rem,5vw,1.6rem);font-weight:900;line-height:1.55}
.opts{display:grid;gap:12px;margin-top:16px}
.opt{border:0;border-radius:22px;padding:16px 14px;font-size:clamp(1.25rem,5vw,1.6rem);font-weight:900;color:#fff;box-shadow:0 7px 0 rgba(0,0,0,.18);transition:transform .12s;min-height:68px}
.opt:nth-child(3n+1){background:linear-gradient(145deg,#7a68ee,#5845c5)}
.opt:nth-child(3n+2){background:linear-gradient(145deg,#29b89c,#168169)}
.opt:nth-child(3n+3){background:linear-gradient(145deg,#ff8aa5,#e0587c)}
.opt:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.opt.right{background:linear-gradient(145deg,#34d399,#0f9d62)!important;animation:boing .6s}
.opt.wrong{background:linear-gradient(145deg,#ffb066,#e8590c)!important;animation:shake .45s}
.opt[disabled]{pointer-events:none}
.opt.dim{opacity:.4}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.fb{min-height:2.2em;font-weight:900;font-size:1.25rem;margin:12px 4px 0;text-align:center}
.fb.good{color:var(--good)}.fb.bad{color:var(--bad)}
.stars-line{display:flex;gap:4px;font-size:1.4rem}
/* reward */
.reward{text-align:center}
.trophy{font-size:5.5rem;animation:bob 2s ease-in-out infinite}
.stars{display:flex;justify-content:center;gap:8px;font-size:3.6rem;margin:6px 0}
.stars span{opacity:.25;filter:grayscale(1);transform:scale(.6);transition:.5s cubic-bezier(.3,1.6,.5,1)}
.stars span.on{opacity:1;filter:none;transform:scale(1) rotate(8deg)}
.sticker{display:inline-flex;align-items:center;gap:12px;background:linear-gradient(135deg,#fff3c8,#ffe1ec);border:3px dashed #f5b94a;border-radius:26px;padding:12px 20px;margin:14px 0;animation:stick .9s cubic-bezier(.3,1.6,.5,1) both .8s}
@keyframes stick{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1) rotate(-3deg)}}
.sticker .em{font-size:3.4rem}
.sticker small{display:block;color:#8a5a00;font-weight:bold}
.actions{display:grid;gap:10px;margin-top:14px}
/* confetti */
.confetti{position:fixed;top:-40px;z-index:99;pointer-events:none;animation:fall linear forwards;font-size:1.6rem}
@keyframes fall{to{transform:translateY(112vh) rotate(540deg);opacity:.9}}
.spark{position:fixed;z-index:99;pointer-events:none;font-size:1.4rem;animation:spark .8s ease-out forwards}
@keyframes spark{from{opacity:1;transform:translate(0,0) scale(.6)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.4)}}
.ltr{direction:ltr;text-align:left}
.ltr .bubble{direction:ltr}
.err{text-align:center;padding:40px 10px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.list li{opacity:1}}
@media(min-width:600px){.opts{grid-template-columns:1fr 1fr}.actions{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><div class="wrap head">
  <a class="back" id="backLink" href="kg1.html">← الدروس</a>
  <div class="hud"><span class="chip" title="مجموع نجومك">⭐ <span id="totalStars">0</span></span><button class="mute" id="muteBtn" aria-label="الصوت" title="الصوت">🔊</button></div>
</div></header>
<main class="wrap" id="app"><div class="err">⏳ جاري تحميل الدرس…</div></main>
<script>
window.__btErr=null;window.addEventListener('error',function(e){window.__btErr=e.message;var a=document.getElementById('app');if(a&&a.textContent.indexOf('جاري')>-1)a.innerHTML='<div class="card" style="text-align:center;padding:30px"><div style="font-size:3rem">😕</div><h2>حدثت مشكلة في تحميل الدرس</h2><p>حدّث الصفحة، أو افتحها من متصفح Chrome محدَّث.</p><a class="btn" href="kg1.html">← الدروس</a></div>'});
</script>
<script>
/* BravoTen — lesson content kit: builds lesson objects from compact tables */
(function () {
  const BT = (window.BT = window.BT || { courses: {} });
  const PARENT_AR = 'للأهل: دعوا الطفل يتتبع الحرف بإصبعه في الهواء، ثم على الطاولة أو في الدقيق أو الرمل، قبل القلم. شجّعوه على كل محاولة ولا تستعجلوه.';
  const PARENT_EN = 'For parents: let your child trace the letter in the air, then on the table or in flour or sand, before using a pencil. Praise every try.';
  const at = (arr, i) => arr[((i % arr.length) + arr.length) % arr.length];

  /* ---------- Arabic letter lesson ---------- */
  function letterAr(L, i, ALL) {
    const others = ALL.filter((_, j) => j !== i);
    const o2 = [at(others, i).ch, at(others, i + 3).ch];
    const dw = [at(others, i).words[0], at(others, i + 4).words[1]];
    const lab = (w) => w[0] + ' ' + w[1];
    const W = L.words;
    const ex = L.extra;
    return {
      t: 'حرف ' + L.name,
      goal: 'أتعرّف على حرف ' + L.name + ' وشكله وصوته، وأميّزه في أول الكلمات وفي وسطها وآخرها.',
      steps: [
        { h: 'نلاحظ الحرف', big: L.ch, sub: L.h.join(' — '), p: 'هذا حرف ' + L.name + '. نسمع صوته ونكرره معًا: ' + L.h.join('، ') + '.', say: L.say + '. ' + L.h.join('، ') },
        { h: 'كلمات تبدأ بحرف ' + L.name, p: 'نضغط على الصورة لنسمع الكلمة، ثم ننطق أول صوت فيها.', items: W.map((w) => [w[0], w[1], 'أول الكلمة']) },
        { h: 'أشكال الحرف', p: 'يتغيّر شكل الحرف قليلًا حسب مكانه في الكلمة، لكنه نفس الحرف.', forms: L.forms },
        { h: 'الحرف في وسط الكلمة وآخرها', p: 'ننظر جيدًا ونجد الحرف في هذه الكلمة.', items: [[ex[0], ex[1], ex[2]]] },
        { h: 'نكتب الحرف', p: 'نرسم الحرف في الهواء، ثم على الطاولة، ثم على الورقة. نبدأ من النقطة ونتبع الاتجاه.', tip: PARENT_AR },
      ],
      q: [
        { q: 'اختر حرف ' + L.name, o: [L.ch].concat(o2), a: L.ch },
        { q: 'أي كلمة تبدأ بحرف ' + L.name + '؟', o: [lab(W[0]), lab(dw[0]), lab(dw[1])], a: lab(W[0]) },
        { q: 'ما الحرف الأول في كلمة ' + W[1][1] + ' ' + W[1][0] + '؟', o: [L.ch].concat(o2), a: L.ch },
        { q: 'أين نجد حرف ' + L.name + ' في كلمة ' + ex[1] + ' ' + ex[0] + '؟', o: ['أول الكلمة', 'وسط الكلمة', 'آخر الكلمة'], a: ex[2] },
      ],
    };
  }

  /* ---------- English phonics lesson ---------- */
  function phonicsEn(P, i, ALL) {
    const others = ALL.filter((_, j) => j !== i);
    const oU = [at(others, i).U, at(others, i + 4).U];
    const oL = [at(others, i).l, at(others, i + 4).l];
    const dw = [at(others, i).words[0], at(others, i + 5).words[1]];
    const lab = (w) => w[0] + ' ' + w[1];
    const W = P.words;
    return {
      t: P.t || 'Phonics: ' + P.U + P.l + ' — ' + P.words.map((w) => w[1]).join(', '),
      goal: 'I can say the sound of ' + P.U + P.l + ' and find it at the start of words.',
      steps: [
        { h: 'Meet the letter', big: P.U + P.l, sub: 'Capital ' + P.U + ' · small ' + P.l, p: 'This is the letter ' + P.U + '. It makes the sound /' + P.l + '/. Say it with me: ' + P.l + ', ' + P.l + ', ' + P.l + '!', say: P.U + '. ' + P.l + ', ' + P.l + ', ' + P.l + '.' },
        { h: 'Words that start with ' + P.l, p: 'Tap a picture to listen. Then say the first sound.', items: W.map((w) => [w[0], w[1], '/' + P.l + '/']) },
        { h: 'Trace the letter', p: 'Draw ' + P.U + ' and ' + P.l + ' in the air with your finger, then on paper.', tip: PARENT_EN },
      ],
      q: [
        { q: 'Which word starts with ' + P.U + '?', o: [lab(W[0]), lab(dw[0]), lab(dw[1])], a: lab(W[0]) },
        { q: 'Find the capital letter.', o: [P.U].concat(oU), a: P.U },
        { q: 'Find the small letter.', o: [P.l].concat(oL), a: P.l },
        { q: 'What is the first letter of “' + W[1][1] + '” ' + W[1][0] + '?', o: [P.U].concat(oU), a: P.U },
      ],
    };
  }

  /* ---------- English vocabulary lesson ---------- */
  const GLOBAL_WORDS = ['apple', 'book', 'sun', 'dog', 'car', 'tree', 'ball', 'cat'];
  function vocabEn(o) {
    const withPic = o.items.filter((x) => x[0]);
    const words = o.items.map((x) => x[1]);
    const qs = withPic.slice(0, 4).map((it, k) => {
      const pool = words.filter((w) => w !== it[1]).concat(GLOBAL_WORDS);
      return { q: 'Which word is ' + it[0] + '?', o: [it[1], at(pool, k), at(pool, k + 1)], a: it[1] };
    });
    (o.extraQ || []).forEach((x) => qs.push(x));
    return {
      t: o.t,
      goal: o.goal,
      steps: [
        { h: 'Listen and repeat', p: 'Tap each card to listen. Say the word out loud.', items: o.items.map((x) => [x[0] || '💬', x[1], x[2] || '']) },
        { h: 'Say it in a sentence', p: 'Now use the words in a sentence.', list: o.sentences.map((s) => ['💬', s]), say: o.sentences.join('. ') },
      ],
      q: qs,
    };
  }

  /* ---------- English colour lesson ---------- */
  const COLOR_DOT = { red: '🔴', blue: '🔵', yellow: '🟡', green: '🟢', orange: '🟠' };
  function colorEn(o) {
    const dots = Object.keys(COLOR_DOT);
    const lab = (c) => COLOR_DOT[c] + ' ' + c;
    const qs = o.items.map((it, k) => {
      const col = it[2] || o.name;
      const oth = dots.filter((c) => c !== col);
      return { q: 'What colour is the ' + it[1] + '? ' + it[0], o: [lab(col), lab(at(oth, k)), lab(at(oth, k + 2))], a: lab(col) };
    });
    return {
      t: o.t,
      goal: 'I can say the colour ' + o.name + ' and find ' + o.name + ' things.',
      steps: [
        { h: 'The colour ' + o.name, big: COLOR_DOT[o.name], sub: o.name + ' · ' + o.ar, p: 'This colour is ' + o.name + '. Say it with me: ' + o.name + '!', say: o.name },
        { h: o.name + ' things', p: 'Tap a card to listen.', items: o.items.map((x) => [x[0], x[1], x[2] || o.name]) },
        { h: 'Mini project', p: o.project, tip: o.parent || PARENT_EN },
      ],
      q: qs.slice(0, 3),
    };
  }

  BT.kit = { letterAr, phonicsEn, vocabEn, colorEn, PARENT_AR, PARENT_EN };
})();

/* KG1 Arabic — first term. Order matches the curriculum map in kg1.html. */
(function () {
  const BT = window.BT, K = BT.kit;
  const T = K.PARENT_AR;

  const LETTERS = [
    { ch: 'أ', name: 'الألف', say: 'ألف', h: ['أَ', 'إِ', 'أُ'], forms: [['وحده', 'ا'], ['أول', 'ا'], ['وسط', 'ـا'], ['آخر', 'ـا']], words: [['🦁', 'أَسَد'], ['🐇', 'أَرْنَب'], ['👂', 'أُذُن']], extra: ['🪓', 'فَأْس', 'وسط الكلمة'] },
    { ch: 'ب', name: 'الباء', say: 'باء', h: ['بَ', 'بِ', 'بُ'], forms: [['وحده', 'ب'], ['أول', 'بـ'], ['وسط', 'ـبـ'], ['آخر', 'ـب']], words: [['🦆', 'بَطَّة'], ['🐄', 'بَقَرَة'], ['🏠', 'بَيْت']], extra: ['📖', 'كِتَاب', 'آخر الكلمة'] },

    if (s.big) body += '<div class="bigbox"><button class="big" id="bigBtn" aria-label="' + esc(s.sub || s.big) + '">' + esc(s.big) + '</button>' + (s.sub ? '<div class="sub">' + esc(s.sub) + '</div>' : '') + '</div>';
    if (s.forms) body += '<div class="forms">' + s.forms.map((f) => '<div class="form"><b>' + esc(f[1]) + '</b><small>' + esc(f[0]) + '</small></div>').join('') + '</div>';
    if (s.items) {
      body += '<div class="hint"><span>' + T.tap + '</span><span class="meter"><span id="meter"></span></span></div><div class="items">';
      s.items.forEach((it, j) => {
        const multi = (it[0] || '').length > 5 ? ' multi' : '';
        body += '<button class="item" data-j="' + j + '" data-say="' + esc(it[1]) + '"><span class="seen">✓</span><span class="pic' + multi + '">' + esc(it[0]) + '</span><span class="word">' + esc(it[1]) + '</span>' + (it[2] ? '<small class="tag">' + esc(it[2]) + '</small>' : '') + '</button>';
      });
      body += '</div>';
    }
    if (s.list) body += '<ul class="list">' + s.list.map((x, k) => '<li data-say="' + esc(x[1]) + '" style="animation-delay:' + k * 0.18 + 's"><span class="e">' + esc(x[0]) + '</span><span>' + esc(x[1]) + '</span></li>').join('') + '</ul>';
    if (s.story) {
      body += '<div class="story">' + s.story.map((x, k) => '<div class="line' + (k === 0 ? ' show' : '') + '" data-say="' + esc(x) + '">' + esc(x) + '</div>').join('') + '</div>';
      if (s.story.length > 1) body += '<button class="reveal" id="revealBtn">' + T.reveal + '</button>';
    }
    if (s.tip) body += '<div class="tip">💡 ' + esc(s.tip) + '</div>';
    const last = step === nSteps - 1;
    const nav = '<div class="nav"><button class="btn light" id="prevBtn"' + (step === 0 ? ' disabled' : '') + '>' + T.prev + '</button><button class="btn' + (last ? ' go' : '') + '" id="nextBtn">' + (last ? T.start : T.next) + '</button></div>';
    app.innerHTML = frame(dots() + '<article class="card enter" id="stepCard">' + body + '</article>' + nav);
    bindStep(s);
  }

  function bindStep(s) {
    $('sayStep').addEventListener('click', () => { sPop(); speak(sayOf(s)); });
    const big = $('bigBtn');
    if (big) big.addEventListener('click', () => { sparkle(big); sPop(); speak(s.say || s.sub || s.big); });
    const total = (s.items || []).length;
    const mark = () => {
      const c = Object.keys(seen[step]).length;
      const m = $('meter'); if (m) m.style.width = (total ? (c / total) * 100 : 0) + '%';
      if (total && c === total) $('nextBtn').classList.add('glow');
    };
    document.querySelectorAll('.item').forEach((b) => {
      const j = b.dataset.j;
      if (seen[step][j]) b.classList.add('seen-on');
      b.addEventListener('click', () => {
        b.classList.remove('hit'); void b.offsetWidth; b.classList.add('hit');
        const first = !seen[step][j];
        seen[step][j] = 1; b.classList.add('seen-on'); sparkle(b); sPop(); speak(b.dataset.say);
        mark();
        if (first && Object.keys(seen[step]).length === total) setTimeout(sOk, 350);
      });
    });
    mark();
    document.querySelectorAll('.list li, .line').forEach((el) => el.addEventListener('click', () => { sPop(); speak(el.dataset.say); }));
    const rb = $('revealBtn');
    if (rb) {
      const lines = document.querySelectorAll('.line');
      speak(lines[0].dataset.say);
      rb.addEventListener('click', () => {
        const hidden = Array.from(lines).find((l) => !l.classList.contains('show'));
        if (hidden) { hidden.classList.add('show'); sPop(); speak(hidden.dataset.say); hidden.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
        if (!Array.from(lines).some((l) => !l.classList.contains('show'))) { rb.remove(); $('nextBtn').classList.add('glow'); }
      });
    }
    $('prevBtn').addEventListener('click', () => { if (step > 0) { step--; renderStep(); window.scrollTo({ top: 0, behavior: 'smooth' }); } });
    $('nextBtn').addEventListener('click', () => {
      sPop();
      if (step < nSteps - 1) { step++; renderStep(); window.scrollTo({ top: 0, behavior: 'smooth' }); } else startGame();
    });
  }

  /* ---------- GAME phase ---------- */
  let qi = 0, firstTry = 0, mistakes = 0, qWrong = false, locked = false;
  const questions = lesson.q;

  function startGame() { qi = 0; firstTry = 0; mistakes = 0; renderQuestion(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

  function renderQuestion() {
    const q = questions[qi];
    qWrong = false; locked = false;
    const opts = shuffle(q.o);
    const pos = (qi / questions.length);
    let h = '<div class="track" aria-hidden="true"><div class="rail"></div><div class="rocket" id="rocket" style="inset-inline-start:calc(8px + (100% - 64px) * ' + pos + ')">🚀</div><div class="flag">🏆</div></div>';
    h += '<div class="qno"><span>' + T.q(qi, questions.length) + '</span><span class="stars-line" aria-label="stars">' + '⭐'.repeat(firstTry) + '</span></div>';
    h += '<article class="card enter"><div class="mascot-row"><div class="mascot" aria-hidden="true">🧸</div><div class="bubble"><div class="qtext">' + esc(q.q) + '</div><button class="say" id="sayQ">' + T.listen.replace(ar ? 'الشرح' : '', '') + '</button></div></div>';
    h += '<div class="opts">' + opts.map((o) => '<button class="opt" data-v="' + esc(o) + '">' + esc(o) + '</button>').join('') + '</div><div class="fb" id="fb" aria-live="polite"></div></article>';
    app.innerHTML = frame(h);
    $('sayQ').addEventListener('click', () => { sPop(); speak(q.q); });
    document.querySelectorAll('.opt').forEach((b) => b.addEventListener('click', () => answer(b, q)));
  }

  function answer(b, q) {
    if (locked) return;
    const ok = b.dataset.v === q.a;
    const fb = $('fb');
    if (ok) {
      locked = true;
      b.classList.add('right');
      document.querySelectorAll('.opt').forEach((x) => { if (x !== b) x.classList.add('dim'); });
      if (!qWrong) firstTry++;
      fb.textContent = pick(T.good); fb.className = 'fb good';
      sOk(); sparkle(b); confetti(14);
      const r = $('rocket'); if (r) r.style.insetInlineStart = 'calc(8px + (100% - 64px) * ' + (qi + 1) / questions.length + ')';
      setTimeout(() => {
        qi++;
        if (qi < questions.length) renderQuestion(); else finish();
      }, 1400);
    } else {
      qWrong = true; mistakes++;
      b.classList.add('wrong'); b.disabled = true;
      fb.textContent = pick(T.again); fb.className = 'fb bad'; sNo();
    }
  }

  /* ---------- REWARD phase ---------- */
  function stickerFor() {
    for (const s of lesson.steps) for (const it of s.items || []) if (it[0] && it[0].length <= 5 && it[0] !== '💬') return [it[0], it[1]];
    return ['🌟', lesson.t];
  }
  function nextLessonUrl() {
    let u = ui, l = li + 1;
    if (l >= course.units[u].length) { u++; l = 0; }
    if (u >= course.units.length) return null;
    return 'lesson.html?c=' + encodeURIComponent(cid) + '&u=' + u + '&l=' + l;
  }
  function finish() {
    const ratio = firstTry / questions.length;
    const stars = ratio >= 0.99 ? 3 : ratio >= 0.5 ? 2 : 1;
    const prog = store.get('bt.progress', {});
    const prev = prog[lid] ? prog[lid].stars || 0 : 0;
    prog[lid] = { stars: Math.max(prev, stars), at: Date.now() };
    store.set('bt.progress', prog);
    const st = stickerFor();
    const album = store.get('bt.stickers', []);
    const isNew = !album.some((x) => x.id === lid);
    if (isNew) { album.push({ id: lid, e: st[0], n: st[1] }); store.set('bt.stickers', album); }
    refreshHud();
    const nu = nextLessonUrl();
    let h = '<article class="card reward enter"><div class="trophy" aria-hidden="true">🏆</div><h2 style="margin:4px 0">' + esc(pick(T.win)) + '</h2>';
    h += '<div class="stars" id="rs" aria-label="' + stars + ' ' + T.stars + '"><span>⭐</span><span>⭐</span><span>⭐</span></div>';
    h += '<div class="sticker" aria-live="polite"><span class="em">' + esc(st[0]) + '</span><div><small>' + (isNew ? T.got : T.sticker) + '</small><b style="font-size:1.2rem">' + esc(st[1]) + '</b></div></div>';
    h += '<div class="actions"><button class="btn go" id="again">' + T.replay + '</button>' + (nu ? '<a class="btn" href="' + nu + '">' + T.nextLesson + '</a>' : '<div class="chip">' + T.allDone + '</div>') + '<a class="btn light" href="' + esc($('backLink').href) + '">' + T.toList + '</a></div></article>';
    app.innerHTML = frame(h);
    document.querySelectorAll('#rs span').forEach((s, i) => { if (i < stars) setTimeout(() => { s.classList.add('on'); sOk(); }, 500 + i * 450); });
    setTimeout(() => { sWin(); confetti(46); }, 300);
    $('again').addEventListener('click', () => { step = 0; renderStep(); window.scrollTo({ top: 0 }); });
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  renderStep();
})();

</script>
</body>
</html>
